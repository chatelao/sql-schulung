site_name: "Oracle 1Z0-171 SQL Zero-to-Certified Handbuch"
site_description: "200-Lektionen-Einsteiger-Curriculum für Oracle AI Database SQL Associate (1Z0-171) mit SCOTT/TIGER und HR Schema"
site_url: "https://sql-schulung.readthedocs.io/"
repo_url: "https://github.com/chatelao/sql-schulung"
repo_name: "chatelao/sql-schulung"

theme:
  name: material
  language: de
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-7
        name: In den Dark Mode wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: teal
      toggle:
        icon: material/brightness-4
        name: In den Light Mode wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - tables
  - attr_list
  - def_list

nav:
  - Start: index.md
  - Einstieg & Setup:
      - Selbststudium-Leitfaden: getting-started/self-study-guide.md
      - Variante A (In-House Oracle DB): getting-started/variant-a-inhouse.md
      - Variante B (Kostenlose Online-Cloud): getting-started/variant-b-online.md
      - FreeSQL Lab Pack & Live-Sandboxes: labs/freesql-upload-pack.md
      - 200-Lektionen-Zeitplan & Pacing: getting-started/lesson-schedule.md
  - Beispiel-Schemas:
      - Klassisches SCOTT/TIGER Schema: schemas/scott-tiger.md
      - Modernes HR Schema (Überblick): schemas/hr-schema.md
  - 200-Lektionen-Lehrbuch:
      - "Phase 1 (L001–L020): Grundlagen & SELECT": phases/phase-01-foundations.md
      - "Phase 2 (L021–L042): Filtern, Sortieren & Variables": phases/phase-02-filtering-sorting.md
      - "Phase 3 (L043–L068): Single-Row & Conversion Functions": phases/phase-03-functions.md
      - "Phase 4 (L069–L082): Grouping & Aggregating": phases/phase-04-aggregation.md
      - "Phase 5 (L083–L102): Multi-Table Joins": phases/phase-05-joins.md
      - "Phase 6 (L103–L122): Subqueries & SET Operators": phases/phase-06-subqueries-set.md
      - "Phase 7 (L123–L138): DML & Transactions": phases/phase-07-dml-tcl.md
      - "Phase 8 (L139–L162): DDL, Constraints, Views & Indexes": phases/phase-08-ddl-objects.md
      - "Phase 9 (L163–L178): Data Dictionary, Time Zones & DCL": phases/phase-09-dict-tz-dcl.md
      - "Phase 10 (L179–L200): Prüfungstraining & Mock Exams": phases/phase-10-exam-prep.md
  - Checkpoints & Cheat Sheets:
      - Identische Checkpoints (CP-0 bis CP-5): checkpoints/benchmark-guide.md
      - SQL Syntax & Clause Order: cheatsheets/sql-syntax.md
      - Functions & Format Models: cheatsheets/functions-reference.md
      - SQL*Plus Spool-Transkripte: cheatsheets/sqlplus-transcripts.md
      - ORA-Fehlerbehebung: cheatsheets/ora-errors.md
      - Top 15 1Z0-171 Exam Traps: cheatsheets/exam-traps.md
  - Advanced SQL (A001–A060):
      - "Modul 1: Hierarchien & Rekursion": advanced/modul-01-hierarchies.md
      - "Modul 2: Regular Expressions": advanced/modul-02-regex.md
      - "Modul 3: JSON in Oracle SQL": advanced/modul-03-json.md
      - "Modul 4: XML in Oracle SQL": advanced/modul-04-xml.md
      - "Modul 5: Window Functions & Pivoting": advanced/modul-05-window-pivoting.md
      - "Modul 6: Query-Patterns & Performance": advanced/modul-06-patterns-performance.md
